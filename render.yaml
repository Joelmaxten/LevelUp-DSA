# Render Blueprint for the free-tier demo (see docs/DEPLOY_RENDER.md).
# Every variable below is listed by NAME only. "sync: false" means Render asks you for the value in its dashboard when the
# Blueprint is created, and the value is never stored in git. Two exceptions, because a mistake would be silent or fatal:
#   FLASK_ENV      is fixed to "production" (forgetting it would run the app in debug mode)
#   PYTHON_VERSION is fixed (the CPU torch wheels in requirements-render.txt exist for Python 3.11 and 3.12)
# SECRET_KEY is generated by Render; DATABASE_URL is wired to the database below.
# Piston is not used by the app (code questions go through OneCompiler), so it is not listed.
services:
  - type: web
    name: levelup-dsa-demo
    runtime: python
    plan: free
    autoDeploy: false
    buildCommand: pip install --upgrade pip && pip install -r requirements-render.txt
    # One worker: roadmap jobs and rate limits live in process memory, and a second worker would double the memory.
    # No --preload. Threads let one worker serve several requests while a roadmap job runs in the background.
    startCommand: gunicorn run:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: levelup-db
          property: connectionString
      # Memory and proxy settings (recommended values are in docs/DEPLOY_RENDER.md)
      - key: WARMUP_ON_START
        sync: false
      - key: SEMANTIC_PATH_FIT
        sync: false
      - key: TRUST_PROXY_HEADERS
        sync: false
      - key: ROADMAP_MODE
        sync: false
      - key: APP_BASE_URL
        sync: false
      # LLM (roadmap personalisation and resume feedback)
      - key: LLM_PROVIDER
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: ROADMAP_MODEL_ID
        sync: false
      - key: FAST_MODEL_ID
        sync: false
      - key: FALLBACK_MODEL_ID
        sync: false
      - key: LLM_MAX_RPM
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      # Live jobs and videos
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # Code questions (OneCompiler)
      - key: CODE_RUNNER
        sync: false
      - key: ONECOMPILER_API_KEY
        sync: false
      # Mail. Render's free tier blocks SMTP ports, so leave these empty: password reset by email then reports itself as unavailable.
      - key: MAIL_SMTP_HOST
        sync: false
      - key: MAIL_SMTP_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false

databases:
  - name: levelup-db
    plan: free
    databaseName: levelup
    user: levelup
