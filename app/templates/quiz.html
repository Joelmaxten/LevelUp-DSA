{% extends "layout.html" %}

{% block title %}Career quiz | LevelUp DSA{% endblock %}

{% block content %}
<div class="wrap quiz stack">
    <header class="page-head">
        <h1 class="h1" id="quiz-heading">Career quiz</h1>
        <div id="quiz-progress"></div>
    </header>

    <div id="quiz-question-box"><div class="card card-pad"><div class="skel" role="status" aria-label="Loading"><span class="skel-line w-70"></span><span class="skel-line skel-block"></span></div></div></div>

    <div id="quiz-results-box" class="stack" hidden></div>

    <details class="disclosure quiz-info">
        <summary>How this works</summary>
        <ul class="info-list">
            <li>Pick what sounds most like you. There are no wrong answers.</li>
            <li>Every question needs an answer. Use Previous to change one.</li>
            <li id="quiz-length-note"></li>
        </ul>
    </details>
</div>

<script src="{{ url_for('static', filename='js/results.js') }}"></script>
<script>
const questionBox = document.getElementById("quiz-question-box");
const resultsBox = document.getElementById("quiz-results-box");
const heading = document.getElementById("quiz-heading");
let quizLength = null;   // { min, max } as reported by /quiz/start, so the page never hard-codes how long the quiz is
const progressBox = document.getElementById("quiz-progress");
const lengthNote = document.getElementById("quiz-length-note");

// The questions on the way to the current one, in order: { id, question }. The last is the one on screen.
// The quiz is adaptive (which question comes next depends on the answers so far), so this only ever
// grows by the question the server sends next, and shrinks by one on Previous.
const path = [];
// question_id -> the answer picked for it. Remembered so Previous / Next shows what you chose before.
const chosen = {};
let moved = false;   // has the student moved at all? Only then is focus moved to the new question.

function showLoading(message) {
    questionBox.replaceChildren(el("div", { className: "card card-pad" }, skeleton(message, 2)));
}

// retry: re-runs the failed request. A 400 means the server's copy of the quiz is gone or out of step
// (for example the session expired), and the only way forward is to start again.
function renderError(result, retry) {
    let message;
    let action;

    if (result.status === 401) {
        message = "You need to be logged in to continue.";
        action = el("a", { className: "btn", href: "/login?next=/quiz", text: "Log in" });
    } else if (result.status === 400) {
        message = (result.data && result.data.error) || "Your quiz session was lost.";
        action = el("button", { className: "btn", type: "button", text: "Restart quiz" });
        action.addEventListener("click", startQuiz);
    } else {
        message = result.status === 0
            ? "Couldn't reach the server. Check your connection."
            : (result.data && result.data.error) || "Something went wrong.";
        action = el("button", { className: "btn", type: "button", text: "Try again" });
        action.addEventListener("click", retry);
    }

    questionBox.replaceChildren(alertEl(message, "error", action));
}

function showQuestion() {
    const { id, question } = path[path.length - 1];
    const number = path.length;
    const title = el("h2", { className: "question", id: "quiz-question", text: question.text });

    const form = questionForm({
        name: `quiz-${id}`,
        labelledBy: "quiz-question",
        options: question.options,
        selected: chosen[id] ?? null,
        canGoBack: number > 1,
        nextText: "Next",
        onBack: (value) => goBack(id, value),
        onNext: (value) => goNext(id, value),
    });

    const max = quizLength ? quizLength.max : null;
    progressBox.replaceChildren(questionProgress(`Question ${number}`, max ? `up to ${max}` : "", max ? (number / max) * 100 : 0,
        max ? `Question ${number} of at most ${max}` : `Question ${number}`));
    questionBox.replaceChildren(el("div", { className: "card card-pad stack" }, title, form));
    if (moved) focusHeading(title);
}

async function goNext(id, value) {
    chosen[id] = value;
    const result = await postJson("/quiz/answer", { question_id: id, option: value });
    if (!result.ok) {
        renderError(result, () => goNext(id, value));
        return;
    }

    moved = true;
    if (result.data.finished) {
        renderResults(result.data.results, result.data.tied_top);
        return;
    }
    path.push({ id: result.data.question_id, question: result.data.question });
    showQuestion();
}

async function goBack(id, value) {
    if (value !== null) chosen[id] = value;   // keep a choice that hasn't been sent yet, in case they come forward again

    const result = await postJson("/quiz/back");
    if (!result.ok) {
        renderError(result, () => goBack(id, value));
        return;
    }

    moved = true;
    path.pop();   // leave the current question
    // The server says which question we are back on and what was chosen; trust it over our own bookkeeping.
    path[path.length - 1] = { id: result.data.question_id, question: result.data.question };
    chosen[result.data.question_id] = result.data.option;
    showQuestion();
}

function renderResults(results, tiedTop) {
    heading.textContent = "Your career results";
    progressBox.replaceChildren();
    questionBox.hidden = true;

    resultsBox.replaceChildren(
        ...careerResultNodes(results, tiedTop),
        el("div", { className: "actions" },
            el("a", { className: "btn", href: "/conversation", text: "Continue to goals" }),
            el("a", { className: "btn btn-ghost", href: "/quiz", text: "Retake quiz" })
        )
    );
    resultsBox.hidden = false;
    focusHeading(heading);
}

async function startQuiz() {
    path.length = 0;
    for (const key of Object.keys(chosen)) delete chosen[key];
    moved = false;
    questionBox.hidden = false;

    showLoading("Loading your first question...");
    const result = await postJson("/quiz/start");
    if (!result.ok) {
        renderError(result, startQuiz);
        return;
    }
    quizLength = { min: result.data.min_questions, max: result.data.max_questions };
    lengthNote.textContent = `It takes ${quizLength.min} to ${quizLength.max} questions.`;
    path.push({ id: result.data.question_id, question: result.data.question });
    showQuestion();
}

startQuiz();
</script>
{% endblock %}
