{% extends "layout.html" %}

{% block title %}Your dashboard | LevelUp DSA{% endblock %}

{% block content %}
<div class="wrap dashboard">
    <header class="page-head">
        <h1 class="h1">Dashboard</h1>
    </header>

    <div id="dashboard-box" class="stack"><div class="card card-pad"><div class="skel" role="status" aria-label="Loading"><span class="skel-line w-40"></span><span class="skel-line skel-block"></span></div></div></div>
</div>

<script src="{{ url_for('static', filename='js/results.js') }}"></script>
<script>
const box = document.getElementById("dashboard-box");

function renderError(result) {
    let message;
    let action;

    if (result.status === 401) {
        message = "You need to be logged in to continue.";
        action = el("a", { className: "btn", href: "/login?next=/dashboard", text: "Log in" });
    } else {
        message = result.status === 0
            ? "Couldn't reach the server. Check your connection."
            : (result.data && result.data.error) || "Something went wrong.";
        action = el("button", { className: "btn", type: "button", text: "Try again" });
        action.addEventListener("click", load);
    }

    box.replaceChildren(alertEl(message, "error", action));
}

// The one thing to do next: a title and a single button. Order: roadmap first, then keep going on it,
// then the resume, the quiz and the skill map.
function nextAction(data) {
    const progress = data.roadmap && data.roadmap.progress;
    const left = progress ? progress.total_steps - progress.completed_count : 0;
    if (!data.roadmap) return { title: "Build your roadmap", button: "Build roadmap", href: "/roadmap" };
    if (left > 0) return { title: `${left} step${left === 1 ? "" : "s"} left on your roadmap`, button: "Continue roadmap", href: "/roadmap" };
    if (!data.resume) return { title: "See what your resume is missing", button: "Analyze resume", href: "/resume" };
    if (!data.career_profile) return { title: "Rank all career paths", button: "Take quiz", href: "/quiz" };
    if (data.dsa && data.dsa.mastered < data.dsa.total) {
        return { title: data.dsa.started ? "Keep going on your skill map" : "Start your skill map", button: "Open skill map", href: "/dsa" };
    }
    return { title: "You're all caught up", button: "Open roadmap", href: "/roadmap" };
}

function nextCard(data) {
    const next = nextAction(data);
    const path = data.career_profile
        ? data.career_profile.career_ranking[0].career_path
        : (data.roadmap && data.roadmap.career_path) || (data.resume && data.resume.target_career_path) || null;
    return el("section", { className: "card card-hero card-pad next-card", "aria-labelledby": "next-title" },
        el("div", { className: "stack-sm" },
            el("p", { className: "eyebrow", text: path ? `Working toward ${path}` : "Get started" }),
            el("h2", { className: "h2", id: "next-title", text: next.title })
        ),
        el("a", { className: "btn", href: next.href, text: next.button })
    );
}

// Overall progress: how many of the stages are done, each a chip that links to its page.
function progressCard(data) {
    const stages = [
        { label: "Quiz", done: !!data.career_profile, href: "/quiz" },
        { label: "Roadmap", done: !!data.roadmap, href: "/roadmap" },
        { label: "Resume", done: !!data.resume, href: "/resume" },
    ];
    if (data.dsa) stages.push({ label: "Skill map", done: data.dsa.started, href: "/dsa" });
    const done = stages.filter((s) => s.done).length;

    const chips = stages.map((s) => el("li", {},
        el("a", { className: `chip ${s.done ? "chip-ink" : "chip-line"}`, href: s.href }, s.done ? icon("tick") : "", el("span", { text: s.label }))));

    const stats = [];
    if (data.roadmap && data.roadmap.progress) {
        const p = data.roadmap.progress;
        stats.push(el("span", { className: "chip", text: `${p.completed_count} of ${p.total_steps} roadmap steps` }));
    }
    if (data.dsa && data.dsa.started) stats.push(el("span", { className: "chip", text: `${data.dsa.mastered} of ${data.dsa.total} topics` }));

    return el("section", { className: "card card-pad progress-card", "aria-label": "Overall progress" },
        ring(Math.round((done / stages.length) * 100), `${done}/${stages.length}`, "done", 104),
        el("div", { className: "stack-sm" },
            el("ul", { className: "chips" }, ...chips),
            stats.length ? el("ul", { className: "chips" }, ...stats.map((c) => el("li", {}, c))) : ""
        )
    );
}

// A compact row per roadmap, newest first.
function roadmapsCard(roadmaps) {
    if (!roadmaps || !roadmaps.length) {
        return el("section", { className: "card" }, emptyState("No roadmaps yet", el("a", { className: "btn", href: "/roadmap" }, "Build roadmap")));
    }
    return el("section", { className: "card card-pad stack-sm", "aria-labelledby": "roadmaps-title" },
        el("div", { className: "cluster between" },
            el("h2", { className: "h3", id: "roadmaps-title", text: "Roadmaps" }),
            el("a", { className: "btn btn-ghost btn-sm", href: "/roadmap?new=1", text: "New roadmap" })
        ),
        el("ul", { className: "roadmap-list" }, ...roadmaps.map((r) => {
            const pct = r.total_steps > 0 ? Math.round((r.completed_count / r.total_steps) * 100) : 0;
            return el("li", { className: "roadmap-list-item" },
                el("a", { className: "roadmap-list-link", href: `/roadmap?id=${r.roadmap_id}` }, r.career_path),
                el("span", { className: "num roadmap-list-pct", text: `${r.completed_count}/${r.total_steps}` }),
                pbar(pct, `${r.career_path}: ${r.completed_count} of ${r.total_steps} steps, ${pct}%`)
            );
        }))
    );
}

function resumeCard(resume) {
    if (!resume) {
        return el("section", { className: "card" }, emptyState("No resume yet", el("a", { className: "btn", href: "/resume" }, "Upload resume")));
    }
    const when = formatDate(resume.uploaded_at);
    const matched = resume.matched_skills.length;
    const total = matched + resume.missing_skills.length;
    const chips = [];
    if (resume.ats_score) chips.push(el("span", { className: "chip chip-ink", text: `ATS ${resume.ats_score.score}/100` }));
    if (total) chips.push(el("span", { className: "chip", text: `${matched} of ${total} skills` }));
    if (when) chips.push(el("span", { className: "chip chip-line", text: when }));
    return el("section", { className: "card card-pad stack-sm", "aria-labelledby": "resume-title" },
        el("div", { className: "cluster between" },
            el("h2", { className: "h3", id: "resume-title", text: "Resume" }),
            el("a", { className: "btn btn-ghost btn-sm", href: "/resume", text: "View analysis" })
        ),
        el("p", { className: "num", text: resume.target_career_path }),
        el("ul", { className: "chips" }, ...chips.map((c) => el("li", {}, c)))
    );
}

// The quiz result and the answers behind it, collapsed so the page stays short.
function careerDetails(profile) {
    if (!profile) return "";
    const top = profile.career_ranking[0];
    const details = el("details", { className: "card card-pad career-details" },
        el("summary", {}, el("span", { className: "h3", text: "Career results" }), el("span", { className: "chip chip-ink", text: `${top.career_path} ${top.confidence_pct}%` })),
        el("div", { className: "stack-sm" },
            ...careerResultNodes(profile.career_ranking),
            profile.answers.length ? answersDisclosure("Your answers", profile.answers) : "",
            el("div", { className: "actions" }, el("a", { className: "btn btn-ghost btn-sm", href: "/quiz", text: "Retake quiz" }))
        )
    );
    return details;
}

function render(data) {
    box.replaceChildren(
        nextCard(data),
        progressCard(data),
        roadmapsCard(data.roadmaps),
        resumeCard(data.resume),
        careerDetails(data.career_profile)
    );
}

async function load() {
    box.replaceChildren(el("div", { className: "card card-pad" }, skeleton("Loading your results", 2)));
    const result = await getJson("/dashboard/data");
    if (!result.ok) {
        renderError(result);
        return;
    }
    render(result.data);
}

load();
</script>
{% endblock %}
