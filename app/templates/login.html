{% extends "layout.html" %}

{% block title %}Log in | LevelUp DSA{% endblock %}

{% block content %}
<div class="wrap auth">
    <div class="card card-pad auth-card stack">
        <h1 class="h1">Log in</h1>

        {% if registered %}
        <div class="alert alert-ok" role="status"><p>Account ready. Log in to start.</p></div>
        {% endif %}

        <form id="login-form" class="form stack-sm">
            <div class="field">
                <label for="email">Email</label>
                <input class="input" type="email" id="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input class="input" type="password" id="password" autocomplete="current-password" required>
            </div>
            <button type="submit" id="login-btn" class="btn btn-block">Log in</button>
            <div id="login-message" class="alert" role="status" hidden><p></p></div>
        </form>
        <p class="muted">New here? <a href="/signup">Create account</a></p>
    </div>
</div>

<script>
// Where to go after logging in: the page the user was trying to reach (validated
// against an allowlist by the server), otherwise the start of the journey.
const NEXT_URL = {{ next_url|tojson }};

const loginMessage = document.getElementById("login-message");

function showLoginMessage(text, isError) {
    loginMessage.firstElementChild.textContent = text;
    loginMessage.className = isError ? "alert alert-error" : "alert alert-ok";
    loginMessage.setAttribute("role", isError ? "alert" : "status");
    loginMessage.hidden = false;
}

document.getElementById("login-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const loginBtn = document.getElementById("login-btn");
    if (loginBtn.getAttribute("aria-busy") === "true") return;   // a request is already under way

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    loginBtn.setAttribute("aria-busy", "true");
    const result = await postJson("/login", { email, password });

    if (result.ok) {
        showLoginMessage("You're in. Taking you to your next step...", false);
        window.location.href = NEXT_URL;
        return;
    }

    loginBtn.removeAttribute("aria-busy");
    showLoginMessage(
        result.status === 0
            ? "Couldn't reach the server. Check your connection and try again."
            : (result.data && result.data.error) || "Something went wrong. Please try again.",
        true
    );
});
</script>
{% endblock %}
