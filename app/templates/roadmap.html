{% extends "layout.html" %}

{% block title %}Your roadmap | LevelUp DSA{% endblock %}

{% block content %}
<div class="wrap roadmap">
    <header class="page-head">
        <h1 class="h1" id="roadmap-heading">Roadmap</h1>
    </header>

    <div id="roadmap-box" class="stack"></div>
</div>

<script src="{{ url_for('static', filename='js/results.js') }}"></script>
<script>
const box = document.getElementById("roadmap-box");

let roadmap = null;             // { roadmap_id, career_path, steps, created_at?, completed_steps, completed_count, total_steps }
let videosState = "none";       // "none" | "pending" | "failed" | "done"
let videosMessage = "";
let roadmapsList = [];          // GET /roadmap/list's result - [{roadmap_id, career_path, created_at, completed_count, total_steps}]

// Kept across re-renders (a fresh roadmap load, a generate, or re-attaching
// resources all rebuild `roadmap`, but progress ticks are independent of
// all three) - the SAME Set object is passed into roadmapStepList every
// render, and toggleStep mutates it in place, so nothing needs to "carry
// it forward" beyond just not reassigning it except when a genuinely new
// or freshly-loaded roadmap tells us what its real completed_steps are.
let completed = new Set();

// POSTs one step's done state; returns true/false (never throws - a
// failure here just means the checkbox's own change handler reverts the
// optimistic UI). On success, resyncs `completed` (and roadmap's own
// count fields) from the response's authoritative completed_steps, not
// just the optimistic guess the checkbox already applied.
async function toggleStep(stepIndex, done) {
    const result = await postJson(`/roadmap/${roadmap.roadmap_id}/progress`, { step_index: stepIndex, done });
    if (!result.ok) return false;
    completed.clear();
    result.data.completed_steps.forEach((i) => completed.add(i));
    roadmap.completed_count = result.data.completed_count;
    roadmap.total_steps = result.data.total_steps;
    return true;
}

function showLoading(message) {
    box.replaceChildren(el("div", { className: "card card-pad" }, skeleton(message, 2)));
}

function errorMessage(result) {
    if (result.status === 0) return "Couldn't reach the server. Check your connection.";
    return (result.data && result.data.error) || "Something went wrong.";
}

// Refreshes the cached roadmaps list (for the switcher and the "you
// already have one" check) - always re-fetched rather than trusted stale,
// since a generate() in this same visit can add to it.
async function refreshRoadmapsList() {
    const result = await getJson("/roadmap/list");
    roadmapsList = result.ok ? result.data : [];
}

// Shown up front, always - not only on a career_path_required signal - so
// the student explicitly picks a path (their top quiz match, one of a
// tied/near-tied set, or any of the 15) before anything is generated.
function renderPicker() {
    box.replaceChildren(careerPathPicker({
        submitText: "Continue",
        onSubmit: handlePathChosen,
    }));
}

// After a path is chosen: if the student already has a roadmap for it,
// offer to open that one instead of silently generating a duplicate;
// otherwise go straight to generating.
async function handlePathChosen(path) {
    showLoading("Checking your roadmaps");
    await refreshRoadmapsList();
    const existing = roadmapsList.find((r) => r.career_path === path);
    if (existing) {
        renderExistingPrompt(path, existing);
    } else {
        generate(path);
    }
}

function renderExistingPrompt(path, existing) {
    const openBtn = el("a", { className: "btn", href: `/roadmap?id=${existing.roadmap_id}`, text: "Open roadmap" });
    const newBtn = el("button", { className: "btn btn-ghost", type: "button", text: "Generate anyway" });
    newBtn.addEventListener("click", () => generate(path));

    box.replaceChildren(el("div", { className: "card card-pad stack-sm" },
        el("p", { className: "h3", text: `You already have a ${path} roadmap.` }),
        el("div", { className: "cluster" },
            pbar(existing.total_steps > 0 ? (existing.completed_count / existing.total_steps) * 100 : 0, `${existing.completed_count} of ${existing.total_steps} steps done`),
            el("span", { className: "num", text: `${existing.completed_count} / ${existing.total_steps}` })
        ),
        el("div", { className: "actions" }, openBtn, newBtn)
    ));
}

function renderError(result, retry) {
    let message;
    let action;

    if (result.status === 401) {
        message = "You need to be logged in to continue.";
        action = el("a", { className: "btn", href: "/login?next=/roadmap", text: "Log in" });
    } else if (result.status === 429 && result.data && result.data.error === "daily_limit") {
        // No retry button: trying again can't succeed until the window moves on.
        const mins = result.data.resets_in_minutes;
        const wait = mins >= 60
            ? `${Math.ceil(mins / 60)} hour${Math.ceil(mins / 60) === 1 ? "" : "s"}`
            : `${mins} minute${mins === 1 ? "" : "s"}`;
        message = `Daily limit of ${result.data.limit} roadmaps reached. Try again in about ${wait}.`;
        action = el("a", { className: "btn", href: "/dashboard", text: "Open dashboard" });
    } else if (result.status === 502 || result.status === 503) {
        // These bodies are developer-facing (raw LLM output / missing index), not for students.
        const raw = (result.data && result.data.error) || "";
        console.error("Roadmap generation failed:", result.status, raw);
        // Quota errors won't clear on an immediate retry, so don't say they might.
        message = /RESOURCE_EXHAUSTED|quota/i.test(raw)
            ? "The AI usage limit is reached. Try again later."
            : "The AI service is busy. Try again in a moment.";
        action = el("button", { className: "btn", type: "button", text: "Try again" });
        action.addEventListener("click", retry);
    } else {
        message = errorMessage(result);
        action = el("button", { className: "btn", type: "button", text: "Try again" });
        action.addEventListener("click", retry);
    }

    box.replaceChildren(alertEl(message, "error", action));
}

function renderIdle(startedFresh) {
    const generateBtn = el("button", { className: "btn", type: "button", text: "Generate roadmap" });
    generateBtn.addEventListener("click", renderPicker);

    const notes = [
        el("li", { text: "We write a route from the basics to job-ready, then find videos for each step." }),
        el("li", { text: "It uses your top quiz match, or a path you choose. This can take up to a minute." }),
    ];
    if (startedFresh) notes.push(el("li", { text: "Any roadmap you already have stays saved." }));

    box.replaceChildren(
        el("div", { className: "card" }, emptyState("No roadmap yet", generateBtn)),
        el("details", { className: "disclosure" }, el("summary", { text: "How this works" }), el("ul", { className: "info-list" }, ...notes))
    );
}

// "Switch roadmap": a dropdown of the student's roadmaps (path, progress, date) - shown only when
// there's more than one, so a student with a single roadmap sees no extra control.
function roadmapSwitcher(currentId) {
    if (roadmapsList.length < 2) return "";
    const select = el("select", { id: "roadmap-switch", className: "select" }, ...roadmapsList.map((r) =>
        el("option", { value: String(r.roadmap_id), text: `${r.career_path} - ${r.completed_count}/${r.total_steps} steps${r.created_at ? `, ${formatDate(r.created_at)}` : ""}` })
    ));
    select.value = String(currentId);
    select.addEventListener("change", () => { window.location.href = `/roadmap?id=${encodeURIComponent(select.value)}`; });
    return el("div", { className: "field switcher" }, el("label", { for: "roadmap-switch", text: "Switch roadmap" }), select);
}

// The notes that stop a roadmap being misread, in one disclosure: where it came from (and whether that source may
// be out of date), and what a "search result" video tag means. "" when there is nothing to say.
function howItWorks(origin) {
    const allSteps = Array.isArray(roadmap.steps) ? roadmap.steps : roadmap.steps.phases.flatMap((phase) => phase.steps);
    const hasSearchVideo = allSteps.some((step) => (step.videos || []).some((v) => v.source === "youtube_search"));
    const notes = [];
    if (origin.note) notes.push(origin.note);
    if (origin.stale) notes.push("The reviewed roadmap may be out of date.");
    if (hasSearchVideo) notes.push("A \"search result\" video was found by search, not picked by a reviewer.");
    if (!notes.length) return "";
    return disclosure("How this works", el("ul", { className: "info-list" }, ...notes.map((text) => el("li", { text }))));
}

function renderRoadmap() {
    const parts = [];

    if (videosState === "failed") {
        const retryBtn = el("button", { className: "btn btn-secondary btn-sm", type: "button", text: "Add videos" });
        retryBtn.addEventListener("click", fetchVideos);
        parts.push(alertEl(videosMessage, "error", retryBtn));
    }

    const indexes = computeStepIndexes(roadmap.steps);
    const doneNow = () => indexes.filter((idx) => completed.has(idx)).length;
    const pctOf = (done) => (indexes.length ? Math.round((done / indexes.length) * 100) : 0);
    const headerRing = ring(pctOf(doneNow()), `${pctOf(doneNow())}%`, `${doneNow()} of ${indexes.length}`, 112);

    const continueBtn = el("button", { className: "btn", type: "button", text: "Continue" });
    continueBtn.addEventListener("click", () => { goToFirstUnfinishedStep(box); });

    const origin = roadmapOrigin(roadmap.steps, roadmap.career_path);
    const when = formatDate(roadmap.created_at);
    const chips = [...(when ? [el("span", { className: "chip chip-line", text: when })] : []), ...origin.chips];

    const head = el("section", { className: "card card-pad rm-head stack", "aria-labelledby": "rm-name" },
        el("div", { className: "rm-head-top" },
            headerRing,
            el("div", { className: "rm-head-main" },
                el("p", { className: "eyebrow", text: "Built for" }),
                el("h2", { className: "rm-name", id: "rm-name", text: roadmap.career_path }),
                chips.length ? el("ul", { className: "chips" }, ...chips.map((c) => el("li", {}, c))) : ""
            ),
            el("div", { className: "rm-head-actions" }, continueBtn, roadmapSwitcher(roadmap.roadmap_id))
        ),
        personalCallout(roadmap.steps),
        howItWorks(origin)
    );
    parts.push(head);

    parts.push(roadmapStepList(roadmap.steps, videosState === "pending", {
        roadmapId: roadmap.roadmap_id,
        completed,
        onToggle: toggleStep,
        onChange: (done) => headerRing.setRing(pctOf(done), `${pctOf(done)}%`, `${done} of ${indexes.length}`),
    }));

    if (videosState !== "pending") {
        const regenBtn = el("button", { className: "btn btn-ghost", type: "button", text: "New roadmap" });
        regenBtn.addEventListener("click", renderPicker);
        parts.push(el("div", { className: "actions" },
            el("a", { className: "btn btn-secondary", href: "/resume", text: "Analyze resume" }),
            el("a", { className: "btn btn-ghost", href: "/dsa", text: "Practice DSA" }),
            regenBtn
        ));
    }

    box.replaceChildren(...parts);
}

async function fetchVideos() {
    videosState = "pending";
    renderRoadmap();

    const result = await postJson(`/roadmap/${roadmap.roadmap_id}/resources`);
    if (!result.ok) {
        videosState = "failed";
        videosMessage = result.status === 401
            ? "You need to be logged in to add videos."
            : `${errorMessage(result)} Your roadmap is saved.`;
        renderRoadmap();
        return;
    }

    roadmap = result.data;
    videosState = "done";
    renderRoadmap();
}

// ---------- generating a roadmap: a background job, polled ----------
//
// A roadmap can take a few minutes, so POST /roadmap/generate-async starts it on the server and this page
// polls GET /roadmap/jobs/<id>: every 1 s for the first 10 s (a cached roadmap is ready in seconds), then every 3 s.
// The job id is kept in sessionStorage so a reload picks the same
// job up again. Polling stops when the job is done or failed, or when the tab has been hidden for more
// than 2 minutes (it resumes when the tab is visible again).

const JOB_KEY = "levelupRoadmapJob";
const POLL_MS = 3000;
const FAST_POLL_MS = 1000;
const FAST_POLL_WINDOW_MS = 10 * 1000;
const HIDDEN_LIMIT_MS = 2 * 60 * 1000;

let activeJob = null;      // { id, path, startedAt (ms), phaseDone, phaseTotal, mode } while one is being followed
let pollTimeout = null;
let tickInterval = null;
let hiddenSince = null;
let pollingPaused = false; // stopped because the tab was hidden too long
let progressNodes = null;  // the text nodes updated in place while a job runs

function rememberJob(id) {
    try { sessionStorage.setItem(JOB_KEY, id); } catch (_) { /* storage can be blocked: the job still runs, it just won't survive a reload */ }
}
function forgetJob() {
    try { sessionStorage.removeItem(JOB_KEY); } catch (_) { /* nothing to do */ }
}
function rememberedJob() {
    try { return sessionStorage.getItem(JOB_KEY); } catch (_) { return null; }
}

function stopPolling() {
    clearTimeout(pollTimeout);
    clearInterval(tickInterval);
    pollTimeout = null;
    tickInterval = null;
    pollingPaused = false;
}

function formatElapsed(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    return `${Math.floor(total / 60)}:${String(total % 60).padStart(2, "0")}`;
}

// Built once per job; only the text of a few nodes changes afterwards (so nothing flickers or re-announces).
function renderProgress() {
    const counter = el("p", { className: "num", role: "status", text: "" });
    const elapsed = el("span", { className: "chip chip-line", "aria-hidden": "true", text: "" });
    const message = el("p", { className: "subtext", text: "" });
    const bar = pbar(0, "Roadmap progress", true);
    progressNodes = { counter, elapsed, message, bar };
    box.replaceChildren(el("div", { className: "card card-pad stack" },
        el("div", { className: "cluster between" }, el("h2", { className: "h2", text: "Building your roadmap" }), elapsed),
        bar,
        counter,
        message
    ));
    updateProgress();
}

function updateProgress() {
    if (!progressNodes || !activeJob) return;
    progressNodes.elapsed.textContent = formatElapsed(Date.now() - activeJob.startedAt);
    const cached = activeJob.mode === "cached";   // a reviewed roadmap personalized for you: seconds, not minutes
    progressNodes.message.textContent = cached
        ? "This usually takes a few seconds."
        : "This can take a few minutes. You can keep this page open.";
    const parts = !cached && activeJob.phaseTotal;
    progressNodes.counter.textContent = parts ? `${activeJob.phaseDone} of ${activeJob.phaseTotal} parts written` : "";
    // A known part count fills the bar; otherwise it just moves, so the page never looks stuck.
    progressNodes.bar.classList.toggle("pbar-indet", !parts);
    const pct = parts ? Math.round((activeJob.phaseDone / activeJob.phaseTotal) * 100) : 0;
    progressNodes.bar.firstElementChild.style.width = parts ? `${pct}%` : "";
    progressNodes.bar.setAttribute("aria-valuenow", String(pct));
}

function renderJobFailed(path) {
    const again = el("button", { className: "btn", type: "button", text: "Try again" });
    again.addEventListener("click", () => (path ? generate(path) : renderPicker()));
    box.replaceChildren(alertEl("We couldn't build your roadmap. This is usually temporary.", "error", again));
}

// The finished job's roadmap, loaded the way a just-generated one always was: show it, then add videos
// in a separate request so a YouTube failure can't cost the student the roadmap.
async function finishJob(roadmapId) {
    showLoading("Loading your roadmap");
    const result = await getJson(`/roadmap/${roadmapId}`);
    if (!result.ok) {
        renderError(result, () => finishJob(roadmapId));
        return;
    }
    roadmap = result.data;
    completed = new Set(roadmap.completed_steps || []);
    await refreshRoadmapsList();
    if (hasAllVideoResults(roadmap.steps)) {
        videosState = "done";   // a cached roadmap already has its videos: no "Finding videos" step
        renderRoadmap();
    } else {
        await fetchVideos();
    }
}

// One poll. Returns false only for "that job doesn't exist (any more)".
async function pollOnce() {
    if (!activeJob) return true;
    const job = activeJob;
    const result = await getJson(`/roadmap/jobs/${job.id}`);
    if (activeJob !== job) return true;   // superseded while the request was in flight

    if (result.status === 404) {
        stopPolling();
        forgetJob();
        activeJob = null;
        return false;
    }
    if (result.ok) {
        const data = result.data;
        if (data.status === "done") {
            stopPolling();
            forgetJob();
            activeJob = null;
            await finishJob(data.roadmap_id);
            return true;
        }
        if (data.status === "failed") {
            stopPolling();
            forgetJob();
            activeJob = null;
            renderJobFailed(job.path);
            return true;
        }
        job.startedAt = Date.now() - data.elapsed_s * 1000;
        if (data.mode) job.mode = data.mode;
        if (data.phase_total) {
            job.phaseDone = data.phase_done;
            job.phaseTotal = data.phase_total;
        }
        updateProgress();
    }
    // A network blip (status 0) or a server error just means: try again at the next tick.
    scheduleNextPoll();
    return true;
}

function scheduleNextPoll() {
    clearTimeout(pollTimeout);
    pollTimeout = setTimeout(() => {
        if (hiddenSince !== null && Date.now() - hiddenSince > HIDDEN_LIMIT_MS) {
            pollingPaused = true;   // resumed by the visibilitychange handler
            clearInterval(tickInterval);
            return;
        }
        pollOnce();
    }, activeJob && Date.now() - activeJob.startedAt < FAST_POLL_WINDOW_MS ? FAST_POLL_MS : POLL_MS);
}

document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        hiddenSince = Date.now();
        return;
    }
    hiddenSince = null;
    if (pollingPaused && activeJob) {
        pollingPaused = false;
        tickInterval = setInterval(updateProgress, 1000);
        pollOnce();
    }
});

function followJob(jobId, path, startedAtMs, mode) {
    stopPolling();
    activeJob = { id: jobId, path, startedAt: startedAtMs || Date.now(), phaseDone: 0, phaseTotal: 0, mode: mode || "full" };
    rememberJob(jobId);
    renderProgress();
    tickInterval = setInterval(updateProgress, 1000);
    scheduleNextPoll();
}

// On a reload: is there a job from this tab? Returns true if the page is now showing it (or its result).
async function resumeJob(jobId) {
    activeJob = { id: jobId, path: null, startedAt: Date.now(), phaseDone: 0, phaseTotal: 0 };
    const result = await getJson(`/roadmap/jobs/${jobId}`);
    if (result.status === 404) {
        forgetJob();
        activeJob = null;
        return false;
    }
    if (result.ok && result.data.status === "done") {
        forgetJob();
        activeJob = null;
        await finishJob(result.data.roadmap_id);
        return true;
    }
    if (result.ok && result.data.status === "failed") {
        forgetJob();
        activeJob = null;
        renderJobFailed(null);
        return true;
    }
    followJob(jobId, null, result.ok ? Date.now() - result.data.elapsed_s * 1000 : Date.now(), result.ok ? result.data.mode : null);
    if (result.ok && result.data.phase_total) {
        activeJob.phaseDone = result.data.phase_done;
        activeJob.phaseTotal = result.data.phase_total;
        updateProgress();
    }
    return true;
}

// targetCareerPath is always sent now - the picker always runs before this
// is ever called (see renderPicker/handlePathChosen), so there's no longer
// a "no path chosen yet" case the way there was before this task.
async function generate(targetCareerPath) {
    showLoading("Starting your roadmap");

    const result = await postJson("/roadmap/generate-async", { target_career_path: targetCareerPath });
    if (result.status === 409 && result.data && result.data.job_id) {
        followJob(result.data.job_id, targetCareerPath);   // already running (for example in another tab): follow it
        return;
    }
    if (!result.ok) {
        if (isCareerPathSignal(result)) {
            // Defensive only - the picker already validates against the
            // real path list, so the server shouldn't disagree in practice.
            renderPicker();
        } else {
            renderError(result, () => generate(targetCareerPath));
        }
        return;
    }
    followJob(result.data.job_id, targetCareerPath, null, result.data.mode);
}

// On arrival: the roadmap named by ?id=N, or (no id) the newest one, or the
// "generate" prompt if there's none yet - unless the student came
// specifically to make a new one (?new=1).
async function loadRoadmap(roadmapId) {
    showLoading("Loading your roadmap");

    const result = await getJson(roadmapId ? `/roadmap/${roadmapId}` : "/roadmap/latest");
    if (result.ok) {
        roadmap = result.data;
        completed = new Set(roadmap.completed_steps || []);
        if (hasAllVideoResults(roadmap.steps)) {
            videosState = "done";
        } else {
            videosState = "failed";
            videosMessage = "Videos haven't been added to this roadmap yet.";
        }
        renderRoadmap();
    } else if (result.status === 404) {
        renderIdle(false);
    } else {
        renderError(result, () => loadRoadmap(roadmapId));
    }
}

async function init() {
    const params = new URLSearchParams(window.location.search);
    showLoading("Loading your roadmap");
    const savedJob = rememberedJob();
    if (savedJob && params.get("new") !== "1" && await resumeJob(savedJob)) return;   // a generation from before the reload
    await refreshRoadmapsList();
    if (params.get("new") === "1") {
        renderIdle(true);
    } else {
        const requestedId = params.get("id");
        await loadRoadmap(requestedId ? Number(requestedId) : null);
    }
}

init();
</script>
{% endblock %}
