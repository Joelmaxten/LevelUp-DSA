{% extends "layout.html" %}

{% block title %}Resume analysis | LevelUp DSA{% endblock %}

{% block content %}
<div class="wrap resume stack">
    <header class="page-head">
        <h1 class="h1">Resume analysis</h1>
    </header>

    <div class="grid grid-2 mode-switch" role="group" aria-label="What do you want to find out?">
        <button type="button" class="mode-card" id="mode-discover" aria-pressed="false">
            <span class="mode-title">Which path fits my resume?</span>
            <span class="mode-sub">Rank all 15 paths by your skills.</span>
        </button>
        <button type="button" class="mode-card" id="mode-fit" aria-pressed="true">
            <span class="mode-title">Does my resume fit my path?</span>
            <span class="mode-sub">Skill gap, salary, ATS score, 30-day plan.</span>
        </button>
    </div>

    <section class="card card-pad stack" aria-label="Upload">
        <form id="resume-form" novalidate class="stack-sm">
            <label class="label" for="resume-file">Your resume <span class="chip chip-line">PDF, max 5 MB</span></label>
            <input type="file" id="resume-file" class="file-input" accept=".pdf,application/pdf" aria-describedby="form-error">
            <p id="form-error" class="field-error" role="alert" hidden></p>
            <div class="actions">
                <button type="submit" id="submit-btn" class="btn">Analyze resume</button>
            </div>
        </form>
        <details class="disclosure">
            <summary>How this works</summary>
            <ul class="info-list" id="mode-steps"></ul>
        </details>
    </section>

    <div id="resume-status"></div>
    <div id="discover-results" class="stack" hidden></div>
    <div id="resume-results" class="stack" hidden></div>
</div>

<script src="{{ url_for('static', filename='js/results.js') }}"></script>
<script>
const form = document.getElementById("resume-form");
const fileInput = document.getElementById("resume-file");
const formError = document.getElementById("form-error");
const submitBtn = document.getElementById("submit-btn");
const statusBox = document.getElementById("resume-status");
const resultsBox = document.getElementById("resume-results");
const discoverBox = document.getElementById("discover-results");

// ---------- the two modes ----------

const MODES = {
    discover: {
        button: "Find paths",
        steps: [
            "We read your PDF and list the skills we find. Nothing is saved as a career profile.",
            "We compare them with what Indian developers in each path report using, and with each path's roadmap.",
            "Pick a path to see its skill gap, salary and 30-day plan, without uploading again.",
        ],
    },
    fit: {
        button: "Analyze resume",
        steps: [
            "We read your PDF and list the skills we find.",
            "You choose a career path after picking your file, and we compare against it.",
            "You get the gap, salary, an ATS score and a 30-day plan.",
        ],
    },
};
let mode = new URLSearchParams(window.location.search).get("mode") === "discover" ? "discover" : "fit";
let discoveredResumeId = null;

function applyMode(next) {
    mode = next;
    for (const name of Object.keys(MODES)) {
        document.getElementById(`mode-${name}`).setAttribute("aria-pressed", name === mode ? "true" : "false");
    }
    document.getElementById("mode-steps").replaceChildren(...MODES[mode].steps.map((text) => el("li", { text })));
    submitBtn.textContent = MODES[mode].button;
    statusBox.replaceChildren();
    formError.hidden = true;
    discoverBox.hidden = mode !== "discover" || discoverBox.childElementCount === 0;
}
document.getElementById("mode-discover").addEventListener("click", () => applyMode("discover"));
document.getElementById("mode-fit").addEventListener("click", () => applyMode("fit"));

const MAX_BYTES = 5 * 1024 * 1024;   // mirrors MAX_CONTENT_LENGTH in app/config.py

// A card with one status line and a moving bar, for the minute an analysis can take.
function busyCard(message) {
    return el("div", { className: "card card-pad stack-sm" },
        el("p", { role: "status", text: message }),
        pbar(0, "Working", true)
    );
}

// ---------- results ----------

// saved: these results came from the database (GET /resume/latest) rather than a just-finished upload.
function renderResults(data, saved) {
    const when = formatDate(data.uploaded_at);
    const chips = [];
    if (saved) chips.push(el("span", { className: "chip chip-line", text: "Latest analysis" }));
    if (when) chips.push(el("span", { className: "chip chip-line", text: when }));
    if (saved && data.file_name) chips.push(el("span", { className: "chip chip-line", text: data.file_name }));

    // Results are shown on this same page, so the way onward from here is the
    // roadmap, or back up to the form to try a different resume.
    const anotherBtn = el("button", { className: "btn btn-ghost", type: "button", text: "Analyze another" });
    anotherBtn.addEventListener("click", () => {
        window.scrollTo({ top: 0 });
        fileInput.focus();
    });

    resultsBox.replaceChildren(
        el("div", { className: "card card-pad stack-sm" },
            el("p", { className: "eyebrow", text: "Measured against" }),
            el("h2", { className: "h2", text: data.target_career_path }),
            chips.length ? el("ul", { className: "chips" }, ...chips.map((c) => el("li", {}, c))) : ""
        ),
        ...resumeAnalysisNodes(data),
        el("div", { className: "actions" },
            el("a", { className: "btn", href: "/roadmap", text: "View roadmap" }),
            el("a", { className: "btn btn-ghost", href: "/dsa", text: "Open skill map" }),
            anotherBtn
        )
    );
    resultsBox.hidden = false;
}

// ---------- upload ----------

function showFormError(message) {
    formError.textContent = message;
    formError.hidden = false;
}

function renderUploadError(result) {
    let action = "";
    let message;

    if (result.status === 401) {
        message = "You need to be logged in to continue.";
        action = el("a", { className: "btn", href: "/login?next=/resume", text: "Log in" });
    } else if (result.status === 413) {
        message = "That file is too large. The limit is 5 MB.";
    } else if (result.status === 429) {
        message = (result.data && result.data.message) || "You're uploading too often. Wait a bit and try again.";
    } else if (result.status === 404) {
        message = "We couldn't find that resume any more. Upload it again.";
    } else if (result.status === 503) {
        message = "This feature isn't available right now. Try again later.";
    } else if (result.status === 0) {
        message = "Couldn't reach the server. Check your connection.";
    } else {
        // 400 / 422 carry a student-safe "error"; the server's "detail" is deliberately never shown.
        message = (result.data && result.data.error) || "Something went wrong.";
    }

    statusBox.replaceChildren(action ? alertEl(message, "error", action) : alertEl(message, "error"));
}

let uploadStarted = false;   // lets a slow "load my saved analysis" response know it must not overwrite a newer upload

// Always shown before upload now (not only on a career_path_required
// signal), so the student explicitly picks a path - their top quiz match,
// one of a tied/near-tied set, or any of the 15 - before analysis runs.
// The path is per-upload only; nothing is saved as a profile.
function renderPicker(file) {
    statusBox.replaceChildren(careerPathPicker({
        lead: file.name,
        submitText: "Analyze resume",
        onSubmit: (path) => upload(file, path),
    }));
}

async function upload(file, targetCareerPath) {
    uploadStarted = true;
    submitBtn.disabled = true;   // also prevents a double-click from running the analysis (and its LLM call) twice
    const hadResults = !resultsBox.hidden;
    resultsBox.hidden = true;
    statusBox.replaceChildren(busyCard("Analyzing your resume. This can take up to a minute."));

    const body = new FormData();
    body.append("resume", file);
    body.append("target_career_path", targetCareerPath);
    const result = await postForm("/resume/upload", body);

    submitBtn.disabled = false;

    if (!result.ok) {
        if (isCareerPathSignal(result)) {
            // Defensive only - the picker already validates against the
            // real path list, so the server shouldn't disagree in practice.
            renderPicker(file);
        } else {
            renderUploadError(result);
        }
        resultsBox.hidden = !hadResults;   // a failed re-upload shouldn't hide the analysis already on screen
        return;
    }

    statusBox.replaceChildren();
    renderResults(result.data, false);
    resultsBox.scrollIntoView();
}

// ---------- mode 1: which path fits my resume ----------

async function discover(file) {
    uploadStarted = true;
    submitBtn.disabled = true;
    discoverBox.hidden = true;
    resultsBox.hidden = true;
    statusBox.replaceChildren(busyCard("Comparing your resume with every path."));

    const body = new FormData();
    body.append("resume", file);
    const result = await postForm("/resume/discover", body);
    submitBtn.disabled = false;

    if (!result.ok) {
        renderUploadError(result);
        return;
    }

    statusBox.replaceChildren();
    discoveredResumeId = result.data.resume_id;
    discoverBox.replaceChildren(...discoverNodes(result.data, analyzeStored, () => {
        window.scrollTo({ top: 0 });
        fileInput.focus();
    }));
    discoverBox.hidden = false;
    discoverBox.scrollIntoView();
}

// "Analyze resume" on a card: no re-upload, the stored resume is used.
async function analyzeStored(path, button) {
    button.disabled = true;
    resultsBox.hidden = true;
    statusBox.replaceChildren(busyCard(`Analyzing your resume against ${path}.`));
    statusBox.scrollIntoView();

    const result = await postJson(`/resume/${discoveredResumeId}/analyze`, { target_career_path: path });
    button.disabled = false;

    if (!result.ok) {
        renderUploadError(result);
        return;
    }
    statusBox.replaceChildren();
    renderResults(result.data, false);
    resultsBox.scrollIntoView();
}

form.addEventListener("submit", (event) => {
    event.preventDefault();
    formError.hidden = true;

    const file = fileInput.files[0];
    if (!file) {
        showFormError("Choose a PDF file first.");
    } else if (!/\.pdf$/i.test(file.name)) {
        showFormError("Only PDF files are accepted.");
    } else if (file.size > MAX_BYTES) {
        showFormError(`That file is ${(file.size / 1024 / 1024).toFixed(1)} MB. The limit is 5 MB.`);
    } else if (mode === "discover") {
        discover(file);
    } else {
        renderPicker(file);
    }
});

// ---------- on arrival: show the saved analysis, unless the user came here to upload a new one ----------

async function showSavedAnalysis() {
    const result = await getJson("/resume/latest");
    if (uploadStarted) return;

    if (result.ok) {
        renderResults(result.data, true);
    } else if (result.status === 401) {
        renderUploadError(result);
    } else if (result.status !== 404) {
        // 404 just means "nothing saved yet". Anything else: say so, but the form still works.
        statusBox.replaceChildren(el("p", { className: "muted", text: "Couldn't load your previous analysis. You can still upload a resume." }));
    }
}

applyMode(mode);

if (new URLSearchParams(window.location.search).get("new") === "1") {
    fileInput.focus();
} else if (mode === "fit") {
    showSavedAnalysis();
}
</script>
{% endblock %}
