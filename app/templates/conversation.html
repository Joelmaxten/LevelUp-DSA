{% extends "layout.html" %}

{% block title %}Your goals | LevelUp DSA{% endblock %}

{% block content %}
<div class="wrap goals stack">
    <header class="page-head">
        <h1 class="h1" id="convo-heading">Your goals</h1>
        <div id="convo-progress"></div>
    </header>

    <div id="convo-question-box"><div class="card card-pad"><div class="skel" role="status" aria-label="Loading"><span class="skel-line w-70"></span><span class="skel-line skel-block"></span></div></div></div>

    <div id="convo-results-box" class="stack" hidden></div>

    <details class="disclosure">
        <summary>How this works</summary>
        <ul class="info-list" id="convo-info">
            <li>These answers tailor your roadmap to what you want.</li>
            <li>Every question needs an answer. Use Previous to change one.</li>
        </ul>
    </details>
</div>

<script src="{{ url_for('static', filename='js/results.js') }}"></script>
<script>
const heading = document.getElementById("convo-heading");
const progressBox = document.getElementById("convo-progress");
const infoList = document.getElementById("convo-info");
const questionBox = document.getElementById("convo-question-box");
const resultsBox = document.getElementById("convo-results-box");

// The questions on the way to the current one, in order: { id, question, isLast }. The last is on screen.
const path = [];
// question_id -> the answer picked for it. Remembered so Previous / Next shows what you chose before,
// and used to build the recap at the end (so a changed answer shows up as changed).
const chosen = {};
let total = 4;       // how many fixed questions there are; the real value comes from /conversation/start
let moved = false;   // has the student moved at all? Only then is focus moved to the new question.

// The optional free-text step after the last fixed question. The real values come
// from /conversation/start; these defaults only matter if that response omits them.
let notesConfig = { prompt: "Anything else you'd like us to know?", max_length: 500 };
let notesDraft = "";   // kept so going Previous from the notes step and forward again doesn't lose what was typed

const NOTES_PLACEHOLDER = "For example: I can study an hour a day on weekdays.";

function showLoading(message) {
    questionBox.replaceChildren(el("div", { className: "card card-pad" }, skeleton(message, 2)));
}

// isStart: the failed request was /conversation/start (vs an answer or Previous).
// retry: re-runs the failed request.
function renderError(result, isStart, retry) {
    let message;
    let action;

    if (result.status === 401) {
        message = "You need to be logged in to continue.";
        action = el("a", { className: "btn", href: "/login?next=/conversation", text: "Log in" });
    } else if (result.status === 400 && isStart) {
        // Server says the quiz hasn't been completed in this session.
        message = (result.data && result.data.error) || "Complete the career quiz first.";
        action = el("a", { className: "btn", href: "/quiz", text: "Take quiz" });
    } else if (result.status === 400) {
        // Conversation state was lost or is out of step server-side; restarting either works or
        // hands the student to the "take the quiz" branch above.
        message = (result.data && result.data.error) || "Your conversation session was lost.";
        action = el("button", { className: "btn", type: "button", text: "Restart questions" });
        action.addEventListener("click", startConversation);
    } else {
        message = result.status === 0
            ? "Couldn't reach the server. Check your connection."
            : (result.data && result.data.error) || "Something went wrong.";
        action = el("button", { className: "btn", type: "button", text: "Try again" });
        action.addEventListener("click", retry);
    }

    questionBox.replaceChildren(alertEl(message, "error", action));
}

function showProgress(left, right, pct) {
    progressBox.replaceChildren(questionProgress(left, right, pct));
}

function showQuestion() {
    const { id, question, isLast } = path[path.length - 1];
    const number = path.length;
    const title = el("h2", { className: "question", id: "convo-question", text: question.text });

    const form = questionForm({
        name: `convo-${id}`,
        labelledBy: "convo-question",
        options: question.options,
        selected: chosen[id] ?? null,
        canGoBack: number > 1,
        nextText: "Next",
        onBack: (value) => goBack(id, value),
        // The last fixed question is not sent yet: it goes to the server together with the optional
        // note, as the conversation's completion request.
        onNext: (value) => (isLast ? goToNotes(id, value) : goNext(id, value)),
    });

    showProgress(`Question ${number} of ${total}`, "", (number / (total + 1)) * 100);
    questionBox.replaceChildren(el("div", { className: "card card-pad stack" }, title, form));
    if (moved) focusHeading(title);
}

async function goNext(id, value) {
    chosen[id] = value;
    const result = await postJson("/conversation/answer", { question_id: id, option: value });
    if (!result.ok) {
        renderError(result, false, () => goNext(id, value));
        return;
    }

    moved = true;
    path.push({ id: result.data.question_id, question: result.data.question, isLast: !!result.data.is_last });
    showQuestion();
}

async function goBack(id, value) {
    if (value !== null) chosen[id] = value;   // keep a choice that hasn't been sent yet, in case they come forward again

    const result = await postJson("/conversation/back");
    if (!result.ok) {
        renderError(result, false, () => goBack(id, value));
        return;
    }

    moved = true;
    path.pop();   // leave the current question
    path[path.length - 1] = { id: result.data.question_id, question: result.data.question, isLast: !!result.data.is_last };
    showQuestion();
}

function goToNotes(id, value) {
    chosen[id] = value;
    moved = true;
    showNotesStep("");
}

// The optional last step. Nothing here is required: "Finish" with an empty box and
// "Skip" both send no notes at all. Previous returns to the last question
// (nothing has been sent for it yet, so no request is needed).
function showNotesStep(errorMessage) {
    const { id } = path[path.length - 1];
    const maxLength = notesConfig.max_length;

    const input = el("textarea", {
        id: "notes-input",
        className: "notes-input",
        rows: "5",
        maxlength: String(maxLength),
        placeholder: NOTES_PLACEHOLDER,
        "aria-describedby": "notes-count",
    });
    input.value = notesDraft;

    const count = el("span", { id: "notes-count", className: "count" });
    const updateCount = () => {
        notesDraft = input.value;
        count.textContent = `${input.value.length} / ${maxLength}`;
        count.classList.toggle("count-warn", input.value.length >= maxLength * 0.9);
    };
    input.addEventListener("input", updateCount);
    updateCount();

    const backBtn = el("button", { className: "btn btn-ghost", type: "button", text: "Previous" });
    backBtn.addEventListener("click", showQuestion);

    const skipBtn = el("button", { className: "btn btn-ghost", type: "button", text: "Skip" });
    skipBtn.addEventListener("click", () => submitAnswer(id, chosen[id], ""));

    const finishBtn = el("button", { className: "btn", type: "button", text: "Finish" });
    finishBtn.addEventListener("click", () => submitAnswer(id, chosen[id], input.value));

    const title = el("h2", { className: "question question-tight" },
        el("label", { for: "notes-input", text: `${notesConfig.prompt} ` }),
        el("span", { className: "chip chip-line", text: "Optional" })
    );

    showProgress("Last step", "", 100);
    questionBox.replaceChildren(el("div", { className: "card card-pad stack" },
        title,
        input,
        el("div", { className: "count-row" }, count),
        errorMessage ? el("p", { className: "field-error", role: "alert", text: errorMessage }) : "",
        el("div", { className: "qnav" }, backBtn, el("div", { className: "qnav-end" }, skipBtn, finishBtn))
    ));
    focusHeading(title);
}

function renderResults(profile, savedNotes) {
    heading.textContent = "Your career profile";
    progressBox.replaceChildren();
    questionBox.hidden = true;
    infoList.replaceChildren(
        el("li", { text: "Your roadmap is built around your top match." }),
        el("li", { text: "Each % is the share of your answers that pointed to that path." })
    );

    // Built from what was chosen last for each question, in order, so a changed answer shows as changed.
    const recap = path.map((step) => ({ question: step.question.text, answer: step.question.options[chosen[step.id]] }));
    // Show the note exactly as the server stored it (trimmed/cleaned), and only if there is one.
    if (savedNotes) recap.push({ question: notesConfig.prompt, answer: savedNotes });

    resultsBox.replaceChildren(
        ...careerResultNodes(profile.career_ranking),
        answersDisclosure("Your answers", recap),
        el("div", { className: "actions" },
            el("a", { className: "btn", href: "/roadmap", text: "Build my roadmap" }),
            el("a", { className: "btn btn-ghost", href: "/quiz", text: "Retake quiz" })
        )
    );
    resultsBox.hidden = false;
    focusHeading(heading);
}

// notes: only ever passed for the final answer; blank means "none" and is not sent at all.
async function submitAnswer(questionId, optionKey, notes = "") {
    // Replacing the buttons immediately also prevents a double-click from
    // submitting the same answer twice.
    showLoading("Saving your answers");

    const body = { question_id: questionId, option: optionKey };
    if (notes.trim()) body.additional_notes = notes;

    const result = await postJson("/conversation/answer", body);
    if (!result.ok) {
        if (result.status === 400 && result.data && result.data.field === "additional_notes") {
            // Fixable by the student (e.g. too long): put them back in the notes box with
            // their text intact, rather than treating it as a lost session.
            showNotesStep(result.data.error);
            return;
        }
        renderError(result, false, () => submitAnswer(questionId, optionKey, notes));
        return;
    }

    if (result.data.finished) {
        renderResults(result.data.profile, result.data.profile.conversation_signals.additional_notes);
    } else {
        // Shouldn't happen for the last question; carry on with whatever the server says is next.
        path.push({ id: result.data.question_id, question: result.data.question, isLast: !!result.data.is_last });
        showQuestion();
    }
}

async function startConversation() {
    path.length = 0;
    for (const key of Object.keys(chosen)) delete chosen[key];
    notesDraft = "";
    moved = false;
    questionBox.hidden = false;

    showLoading("Loading your first question");

    const result = await postJson("/conversation/start");
    if (!result.ok) {
        renderError(result, true, startConversation);
        return;
    }
    notesConfig = { ...notesConfig, ...(result.data.additional_notes || {}) };
    if (result.data.total) total = result.data.total;
    path.push({ id: result.data.question_id, question: result.data.question, isLast: !!result.data.is_last });
    showQuestion();
}

startConversation();
</script>
{% endblock %}
