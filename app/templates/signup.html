{% extends "layout.html" %}

{% block title %}Sign up | LevelUp DSA{% endblock %}

{% block content %}
<div class="wrap auth">
    <div class="card card-pad auth-card stack">
        <h1 class="h1">Create account</h1>

        <form id="signup-form" class="form stack-sm">
            <div class="field">
                <label for="name">Name</label>
                <input class="input" type="text" id="name" autocomplete="name" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input class="input" type="email" id="email" autocomplete="email" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input class="input" type="password" id="password" required autocomplete="new-password"
                       aria-describedby="password-hint password-error">
                <ul id="password-hint" class="chips rule-chips" aria-label="Password rules">
                    <li class="chip chip-line" data-rule="length">8+ characters</li>
                    <li class="chip chip-line" data-rule="upper">A-Z</li>
                    <li class="chip chip-line" data-rule="lower">a-z</li>
                    <li class="chip chip-line" data-rule="digit">0-9</li>
                    <li class="chip chip-line" data-rule="special">Symbol</li>
                </ul>
                <p id="password-error" class="field-error" role="alert" hidden></p>
            </div>
            <button type="submit" id="signup-btn" class="btn btn-block">Create account</button>
            <div id="signup-message" class="alert" role="status" hidden><p></p></div>
        </form>
        <p class="muted">Have an account? <a href="/login">Log in</a></p>
    </div>
</div>

<script>
const form = document.getElementById("signup-form");
const passwordInput = document.getElementById("password");
const passwordError = document.getElementById("password-error");
const signupBtn = document.getElementById("signup-btn");
const messageEl = document.getElementById("signup-message");

// Mirrors is_valid_password() / PASSWORD_RULE_MESSAGE in app/routes/auth.py.
// The server is the real enforcement point; this is only for instant feedback,
// so keep the rule and the wording identical to the backend's.
const PASSWORD_RULE_MESSAGE = "Password must be at least 8 characters long and include at least one uppercase letter, one lowercase letter, one number, and one special character (such as ! @ # $ %).";
const MIN_PASSWORD_LENGTH = 8;
// Same set as Python's string.punctuation. Uppercase/lowercase are ASCII A-Z / a-z
// here and in the backend (string.ascii_uppercase / ascii_lowercase), so both sides
// agree even on accented or other non-ASCII letters (which count as neither).
const SPECIAL_CHARS = "!\"#$%&'()*+,-./:;<=>?@[\\]^_`{|}~";

function isValidPassword(password) {
    const chars = [...password];   // code points, like Python's len()
    return chars.length >= MIN_PASSWORD_LENGTH
        && /[A-Z]/.test(password)
        && /[a-z]/.test(password)
        && /[0-9]/.test(password)
        && chars.some((c) => SPECIAL_CHARS.includes(c));
}

function showPasswordError(show) {
    passwordError.textContent = show ? PASSWORD_RULE_MESSAGE : "";
    passwordError.hidden = !show;
    passwordInput.setAttribute("aria-invalid", show ? "true" : "false");
}

function showMessage(text, isError) {
    messageEl.firstElementChild.textContent = text;
    messageEl.className = isError ? "alert alert-error" : "alert alert-ok";
    messageEl.setAttribute("role", isError ? "alert" : "status");
    messageEl.hidden = false;
}

// The rule chips light up as each rule is met. The server is still the real check (see above).
const ruleChecks = {
    length: (pw) => [...pw].length >= MIN_PASSWORD_LENGTH,
    upper: (pw) => /[A-Z]/.test(pw),
    lower: (pw) => /[a-z]/.test(pw),
    digit: (pw) => /[0-9]/.test(pw),
    special: (pw) => [...pw].some((c) => SPECIAL_CHARS.includes(c)),
};
function updateRuleChips() {
    document.querySelectorAll(".rule-chips [data-rule]").forEach((chip) => {
        const met = ruleChecks[chip.dataset.rule](passwordInput.value);
        chip.classList.toggle("chip-ink", met);
        chip.classList.toggle("chip-line", !met);
        chip.setAttribute("aria-label", `${chip.textContent}: ${met ? "met" : "not met"}`);
    });
}
passwordInput.addEventListener("input", updateRuleChips);
updateRuleChips();

// Validate once the field has been left, then keep the message live while
// they fix it, so there's no error flashing while they're still on their first keystrokes.
let passwordTouched = false;
passwordInput.addEventListener("blur", () => {
    if (passwordInput.value === "") return;   // an empty field is the browser's "required" check
    passwordTouched = true;
    showPasswordError(!isValidPassword(passwordInput.value));
});
passwordInput.addEventListener("input", () => {
    if (passwordTouched) showPasswordError(!isValidPassword(passwordInput.value));
});

form.addEventListener("submit", async function (e) {
    e.preventDefault();
    if (signupBtn.getAttribute("aria-busy") === "true") return;   // a request is already under way
    messageEl.hidden = true;

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = passwordInput.value;

    if (!isValidPassword(password)) {
        passwordTouched = true;
        showPasswordError(true);
        passwordInput.focus();
        return;
    }

    signupBtn.setAttribute("aria-busy", "true");
    const result = await postJson("/signup", { name, email, password });

    if (result.ok) {
        showMessage("Account created. Taking you to the login page...", false);
        window.location.href = "/login?registered=1";
        return;
    }

    signupBtn.removeAttribute("aria-busy");
    showMessage(
        result.status === 0
            ? "Couldn't reach the server. Check your connection and try again."
            : (result.data && result.data.error) || "Something went wrong. Please try again.",
        true
    );
});
</script>
{% endblock %}
