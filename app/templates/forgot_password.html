{% extends "layout.html" %}

{% block title %}Forgot password | LevelUp DSA{% endblock %}

{% block content %}
<div class="wrap auth">
    <div class="card card-pad auth-card stack">
        <h1 class="h1">Forgot password</h1>
        <p class="muted">Enter the email you signed up with. We will email you a link to choose a new password.</p>

        <form id="forgot-form" class="form stack-sm">
            <div class="field">
                <label for="forgot-email">Email</label>
                <input class="input" type="email" id="forgot-email" autocomplete="email" autocapitalize="none"
                       spellcheck="false" required>
            </div>
            <button type="submit" id="forgot-btn" class="btn btn-block">Send reset link</button>
            <div id="forgot-message" class="alert" role="status" hidden><p></p></div>
        </form>
        <p class="muted"><a href="/login">Back to log in</a></p>
    </div>
</div>

<script>
const forgotMessage = document.getElementById("forgot-message");

function showForgotMessage(text, isError) {
    forgotMessage.firstElementChild.textContent = text;
    forgotMessage.className = isError ? "alert alert-error" : "alert alert-ok";
    forgotMessage.setAttribute("role", isError ? "alert" : "status");
    forgotMessage.hidden = false;
}

document.getElementById("forgot-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const btn = document.getElementById("forgot-btn");
    if (btn.getAttribute("aria-busy") === "true") return;

    btn.setAttribute("aria-busy", "true");
    const result = await postJson("/forgot-password", { email: document.getElementById("forgot-email").value.trim() });
    btn.removeAttribute("aria-busy");

    if (result.ok) {
        showForgotMessage(result.data.message, false);
        return;
    }
    showForgotMessage(
        result.status === 0
            ? "Couldn't reach the server. Check your connection and try again."
            : (result.data && (result.data.error || result.data.message)) || "Something went wrong. Please try again.",
        true
    );
});
</script>
{% endblock %}
